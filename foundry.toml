[profile.default]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 700
via_ir         = true
fs_permissions = [
    { access = "read-write", path = "./results" },
    # Read-only, for test_Repo_ContainsZeroModifiedSwapVMSource (T9): walk the tracked
    # Solidity, and pin the swap-vm files this repo compiles against to the v1.0.2 tag.
    { access = "read", path = "./src" },
    { access = "read", path = "./test" },
    { access = "read", path = "./yarn.lock" },
    { access = "read", path = "./node_modules/@1inch/swap-vm/src" }
]

[profile.default.optimizer_details]
yul = true
yulDetails = { stackAllocation = true, optimizerSteps = "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul Tpeul]jmul[jul] VcTOcul jmul : fDnTOcmu" }

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header        = "all"
override_spacing             = false
bracket_spacing              = true
int_types                    = "long"
number_underscore            = "thousands"
